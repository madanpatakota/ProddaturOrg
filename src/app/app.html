<div
  style="
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at top left, #164b80 0%, transparent 45%),
      radial-gradient(circle at bottom right, #143b64 0%, transparent 40%),
      #071729;
    font-family: Arial, sans-serif;
    color: #ffffff;
  "
>
  <main
    style="
      width: 100%;
      max-width: 760px;
      box-sizing: border-box;
      padding: clamp(32px, 7vw, 72px) clamp(24px, 5vw, 56px);
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
    "
  >
    <!-- Status badge -->
    <div
      style="
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 10px 16px;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 50px;
        color: #7dd3fc;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2px;
      "
    >
      <span
        aria-hidden="true"
        style="
          width: 8px;
          height: 8px;
          background: #38bdf8;
          border-radius: 50%;
          box-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
        "
      ></span>
      COMING SOON
    </div>

    <!-- News icon -->
    <div
      style="
        width: 92px;
        height: 92px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 36px auto 28px;
        background: linear-gradient(135deg, #38bdf8, #2563eb);
        border-radius: 24px;
        box-shadow: 0 12px 36px rgba(37, 99, 235, 0.3);
        transform: rotate(-6deg);
      "
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="4" y="3" width="16" height="18" rx="2"></rect>
        <path d="M8 7h8"></path>
        <path d="M8 11h8"></path>
        <path d="M8 15h3"></path>
        <path d="M8 18h3"></path>
        <rect x="14" y="15" width="2" height="3" rx=".5"></rect>
      </svg>
    </div>

    <!-- Main message -->
    <h1
      style="
        margin: 0;
        font-size: clamp(36px, 7vw, 60px);
        line-height: 1.12;
        letter-spacing: -2px;
        font-weight: 800;
      "
    >
      A fresh look.<br />
      <span style="color: #7dd3fc;">The latest news.</span>
    </h1>

    <p
      style="
        margin: 26px 0 12px;
        font-size: 19px;
        font-weight: 600;
        color: #e2e8f0;
      "
    >
      Our website is under construction.
    </p>

    <p
      style="
        max-width: 470px;
        margin: 0 auto;
        font-size: 16px;
        line-height: 1.8;
        color: #a9bbd0;
      "
    >
      We’re getting ready to bring you the latest news, local stories,
      and important updates. Check back soon!
    </p>

    <!-- Divider -->
    <div
      style="
        width: 64px;
        height: 4px;
        margin: 34px auto;
        border-radius: 4px;
        background: linear-gradient(90deg, #38bdf8, #2563eb);
      "
    ></div>

    <p
      style="
        margin: 0;
        font-size: 14px;
        color: #a9bbd0;
        letter-spacing: 0.3px;
      "
    >
      Stay curious. Stay connected.
    </p>
  </main>
</div>
